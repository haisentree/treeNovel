# treeNovel 部署: echo "ADMIN_PASSWORD=<管理密码>" > .env && docker compose up -d
# 镜像: self-tree-novel:1.1 (compose 内为本地 tag, 拉取新版本后 docker tag 对齐)
# 数据: 书库打包在镜像内 /app/treeNovel.db (源: 仓库 data/treeNovel.db 快照), 拉取即用;
#       爬虫新增数据写容器可写层, 重建容器回退镜像快照——需保留增量时 docker cp 导出或重新打包镜像
services:
  treenovel:
    build: .
    image: self-tree-novel:latest
    container_name: tree-novel
    restart: unless-stopped
    ports:
      - "8083:8083"   # 宿主端口可改左侧; 容器内固定 8083 (镜像 CMD)
    environment:
      # 缺失拒绝启动: 后台 /admin 无密码可被任意登录
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请在项目根目录 .env 中设置 ADMIN_PASSWORD}
      - TZ=Asia/Shanghai
    # 可选: 本地电子书目录挂载 (/localbook 在线浏览原文件)
    # volumes:
    #   - ./book:/app/book
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
