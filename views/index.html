<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="/static/css/base.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">

</head>
<body>
<div class="container">
    <div class="row" style="border-style: solid">
        {{ range $key,$val := .ArticleList }}
        <div class="col-4" >
            <div class = "list-item">
                <a href="/article/{{$val.ID}}">
                    <img src= "{{$val.CoverURL}}" style="float: left;width: 120px;height: 150px;padding-right: 2px">
                </a>
                <ul>
                    <li style="font-size: 20px">{{$val.Title}}</li>
                    <li style="overflow: hidden;height: 100px">{{$val.Description}}</li>
                    <li>{{$val.Author}}</li>
                </ul>
            </div>
        </div>
        {{ end }}
    </div>
</div>
</body>
</html>
